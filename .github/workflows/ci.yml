# ─────────────────────────────────────────────────────────────────────────────
# Unfit for Print — CI
#
# Runs on every pull request. Nothing here deploys or publishes; that is
# release-please.yml's job, and it only runs on pushes to main.
#
# Three jobs:
#   Tests     — vitest against a throwaway Postgres service container (gating)
#   Build     — `nuxt build`, the check that catches what unit tests cannot
#   Typecheck — `vue-tsc --noEmit`, clean since the 28 legacy errors were fixed
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A new push to a PR makes the in-flight run pointless — cancel it rather than
# paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests ───────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unfit
          POSTGRES_PASSWORD: unfit
          POSTGRES_DB: unfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unfit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DATABASE_URL is deliberately NOT set for this job. tests/server/db/*
      # unconditionally delete real tables, and tests/server/setup.ts refuses
      # to run when TEST_DATABASE_URL equals DATABASE_URL. Leaving the real
      # one unset means there is nothing here that could point at production
      # even by accident. The migrate step below scopes DATABASE_URL to
      # itself, because drizzle-kit only reads that name.
      TEST_DATABASE_URL: postgres://unfit:unfit@localhost:5432/unfit
      # Skip the documented baseline of already-failing suites. See the
      # KNOWN_FAILING ledger in vitest.config.ts.
      VITEST_SKIP_KNOWN_FAILING: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No `version:` — pnpm/action-setup reads packageManager from package.json,
      # and specifying both is an error.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://unfit:unfit@localhost:5432/unfit

      # One step: vitest.config.ts splits the run into a parallel `unit`
      # project and a `db` project with fileParallelism disabled, so the
      # database suites no longer need their own invocation to stay serial.
      - name: Tests
        run: pnpm vitest run

  # ── Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ── Typecheck ───────────────────────────────────────────────────────────
  # Was advisory while main carried ~28 pre-existing errors. Now that it is
  # clean it fails the run like the other jobs — it is the check that would
  # have caught a removed TTS provider still being read on the home page,
  # which Tests and Build both passed.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ── Semgrep ─────────────────────────────────────────────────────────────
  # Advisory: findings are reported, not enforced. Semgrep exits 0 when it
  # finds something unless `--error` is passed, so the job goes green on
  # findings and red only when Semgrep itself fails (bad config, bad rule).
  # That is the distinction worth keeping -- a broken scanner should be loud,
  # a list of findings should not cry wolf on every PR.
  #
  # The findings land in the job summary rather than only the log, so they
  # are one click from the PR instead of buried in a green job nobody opens.
  #
  # To make this gate instead: add `--error` below, and add "Semgrep" to
  # main's required checks.
  #
  # `.semgrep/` carries repo-local rules. The community packs do not parse
  # .vue templates -- verified by running them against the stored-XSS sink
  # fixed in #141, which they did not flag -- so the packs cover server/ and
  # the local rules cover the template sinks.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            --config=p/nodejs \
            --config=p/secrets \
            --config=.semgrep/ \
            --metrics=off \
            --exclude=node_modules \
            --exclude=.nuxt \
            --exclude=.output \
            --text --output=semgrep.txt
          cat semgrep.txt

      - name: Report findings
        if: always()
        run: |
          {
            echo "## Semgrep"
            echo
            if [ -s semgrep.txt ]; then
              echo '```'
              # The step summary caps at 1 MiB; keep well inside it.
              tail -c 500000 semgrep.txt
              echo '```'
            else
              echo "No output — the scan did not produce a report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
