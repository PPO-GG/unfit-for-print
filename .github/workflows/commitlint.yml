name: Lint Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

# This workflow runs a third-party action maintained by an individual, so it
# gets the narrowest token the job can do its work with rather than the repo
# default. Reading the commits on a PR is all it needs.
permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1