# ─────────────────────────────────────────────────────────────────────────────
# Unfit for Print — Release & Publish
#
# Triggered on every push to main:
#   1. release-please evaluates new commits and opens/updates a Release PR
#   2. When the Release PR is merged, a GitHub Release + tag are created,
#      then a Docker image is built and pushed to GHCR
#
# This ensures only ONE production image build per release cycle, no
# redundant builds on regular pushes to main or on release-please's own PR
# branch. Deployment (pulling/running the new image) happens on the host,
# outside this workflow.
#
# Publishes:
#   ghcr.io/<owner>/unfit-web:<tag>
# ─────────────────────────────────────────────────────────────────────────────

name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy without a release (for debugging)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── Step 1: Release Please ──────────────────────────────────────────────
  # On regular pushes: creates or updates the Release PR (no deploy).
  # On Release PR merge: creates a GitHub Release + tag, then signals deploy.
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 2: Build & Publish Docker image (only on new release OR manual dispatch) ───
  build-web:
    name: Build & Publish Web Image
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/unfit-web
          tags: |
            # Always tag :latest
            type=raw,value=latest
            # Short SHA for traceability
            type=sha,prefix=
            # Semver tags from the release (v1.2.0 → 1.2.0, 1.2, 1)
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
