# ─────────────────────────────────────────────────────────────────────────────
# Unfit for Print — Release & Publish
#
# Triggered on every push to main:
#   1. release-please evaluates new commits and opens/updates a Release PR
#   2. When the Release PR is merged, a GitHub Release + tag are created,
#      then Docker images are built and pushed to GHCR
#
# This ensures only ONE production image build per release cycle, no
# redundant builds on regular pushes to main or on release-please's own PR
# branch. Deployment (pulling/running the new image) happens on the host,
# outside this workflow.
#
# Publishes:
#   ghcr.io/<owner>/unfit-web:<tag>
#   ghcr.io/<owner>/unfit-teleportal:<tag>
# ─────────────────────────────────────────────────────────────────────────────

name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy without a release (for debugging)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── Step 1: Release Please ──────────────────────────────────────────────
  # On regular pushes: creates or updates the Release PR (no deploy).
  # On Release PR merge: creates a GitHub Release + tag, then signals deploy.
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Step 2: Detect which image(s) actually changed ──────────────────────
  # Diffs the PREVIOUS RELEASE TAG against HEAD — i.e. everything this release
  # actually contains.
  #
  # This used to diff `github.event.before`, which is wrong on the only push
  # that matters: when the Release PR merges, `before` is the commit right
  # before the merge, so the diff contained nothing but release-please's own
  # version + changelog commit. `teleportal-server/**` therefore never matched
  # and the teleportal image was silently never rebuilt on a release, while
  # `web` always matched because its '**' filter catches CHANGELOG.md.
  #
  # Emits the build matrix itself so a component that genuinely did not change
  # produces NO job, rather than a job whose steps are all skipped but which
  # still reports success.
  detect-changes:
    name: Detect changed paths
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, needed to diff against the last release

      - name: Filter changed paths
        id: filter
        run: |
          set -euo pipefail

          build_web=false
          build_teleportal=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — rebuilding everything."
            build_web=true
            build_teleportal=true
          else
            # release-please has just created this release's tag, so the tag
            # before it marks the previous release.
            prev_tag=$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')
            if [ -z "$prev_tag" ]; then
              echo "No previous release tag found — building everything."
              build_web=true
              build_teleportal=true
            else
              echo "Diffing $prev_tag..HEAD"
              changed=$(git diff --name-only "$prev_tag"..HEAD)
              echo "$changed"
              if echo "$changed" | grep -q '^teleportal-server/'; then
                build_teleportal=true
              fi
              if echo "$changed" | grep -qv '^teleportal-server/'; then
                build_web=true
              fi
            fi
          fi

          web_entry='{"name":"web","image":"unfit-web","context":".","file":"./Dockerfile"}'
          tp_entry='{"name":"teleportal","image":"unfit-teleportal","context":"./teleportal-server","file":"./teleportal-server/Dockerfile"}'

          entries=""
          if [ "$build_web" = true ]; then
            entries="$web_entry"
          fi
          if [ "$build_teleportal" = true ]; then
            if [ -n "$entries" ]; then
              entries="$entries,$tp_entry"
            else
              entries="$tp_entry"
            fi
          fi

          echo "web=$build_web teleportal=$build_teleportal"
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"

  # ── Step 3: Build & Publish Docker images (only the ones that changed) ──
  build-images:
    name: Build & Publish ${{ matrix.name }} Image
    needs: [release-please, detect-changes]
    # An empty matrix means nothing changed, so no job runs at all — the
    # honest outcome. Every step below runs unconditionally, so a green tick
    # here always means an image was actually built and pushed.
    if: ${{ always() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            # Always tag :latest
            type=raw,value=latest
            # Short SHA for traceability
            type=sha,prefix=
            # Semver tags from the release (v1.2.0 → 1.2.0, 1.2, 1)
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Advisory (`exit-code: 0`): report OS-layer CVEs without failing a
      # release. Nothing else looks at what is inside these images -- CodeQL
      # and Semgrep both only ever see source.
      #
      # This runs after the push, so a finding names an image that is already
      # published. Scanning before would mean building twice (or `load: true`
      # plus a second push), which is not worth it while the result is
      # advisory. Revisit if this is ever made gating.
      #
      # --ignore-unfixed matters: both images are Debian-based (node:*-slim),
      # and the base layer carries a standing set of CVEs with no fix
      # available. Without it the report is noise.
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
