services:
  teleportal:
    image: ghcr.io/ppo-gg/unfit-teleportal:latest
    container_name: unfit-teleportal
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://localhost:3000/health",
          "--no-verbose",
          "--tries=1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      br0_3:
        ipv4_address: 10.1.0.225

  web:
    image: ghcr.io/ppo-gg/unfit-web:latest
    container_name: unfit-web
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      NUXT_ACTIVITY_TOKEN_SECRET: ${NUXT_ACTIVITY_TOKEN_SECRET}
      NUXT_DISCORD_CLIENT_SECRET: ${NUXT_DISCORD_CLIENT_SECRET}
      NUXT_DISCORD_PUBLIC_KEY: ${NUXT_DISCORD_PUBLIC_KEY}
      NUXT_DISCORD_APPLICATION_ID: ${NUXT_DISCORD_APPLICATION_ID}
      NUXT_PUBLIC_DISCORD_CLIENT_ID: ${NUXT_PUBLIC_DISCORD_CLIENT_ID}
      NUXT_PUBLIC_BASE_URL: ${NUXT_PUBLIC_BASE_URL:-https://unfit.cards}
      NUXT_PUBLIC_LOBBY_TELEPORTAL_URL: ${NUXT_PUBLIC_LOBBY_TELEPORTAL_URL:-wss://teleportal.unfit.cards}
      NUXT_R2_ACCOUNT_ID: ${NUXT_R2_ACCOUNT_ID}
      NUXT_R2_ACCESS_KEY_ID: ${NUXT_R2_ACCESS_KEY_ID}
      NUXT_R2_SECRET_ACCESS_KEY: ${NUXT_R2_SECRET_ACCESS_KEY}
      NUXT_R2_BUCKET: ${NUXT_R2_BUCKET:-decoration-images}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY}
    ports:
      # Host 3000 is already claimed by the `teleportal` service above, so
      # web is published on 8080 instead. Adjust to taste / put a reverse
      # proxy in front of both.
      - "3000:3000"
    networks:
      br0_3:
        ipv4_address: 10.1.0.226

