services:
  teleportal:
    build:
      context: ./teleportal-server
      dockerfile: Dockerfile
    container_name: unfit-teleportal
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://localhost:3000/health",
          "--no-verbose",
          "--tries=1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      br0_3:
        ipv4_address: 10.1.0.225

  postgres:
    image: postgres:16-alpine
    container_name: unfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unfit}
      POSTGRES_USER: ${POSTGRES_USER:-unfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unfit}
    volumes:
      - unfit-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unfit} -d ${POSTGRES_DB:-unfit}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  unfit-pgdata:

networks:
  br0_3:
    name: br0.3
    external: true
